name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!docs/CONTRIBUTING.md"
      - "!docs/CUSTOMIZE.md"
      - "!docs/FAQ.md"
      - "!docs/INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!docs/CONTRIBUTING.md"
      - "!docs/CUSTOMIZE.md"
      - "!docs/FAQ.md"
      - "!docs/INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Check CSL styles
        run: |
          echo "csl-styles location:"
          bundle show csl-styles
          echo "Available APS/Nature styles:"
          find "$(bundle show csl-styles)" -type f \( -iname "*physics*.csl" -o -iname "*nature*.csl" -o -iname "*american*.csl" \) | sort
      
      - name: Locate bib template
        run: |
          echo "al_folio_core:"
          bundle show al_folio_core
          echo
          echo "bib.liquid:"
          find "$(bundle show al_folio_core)" -type f -name "bib.liquid" -print

      - name: Show bib template
        run: |
          cat "$(bundle show al_folio_core)/_layouts/bib.liquid"
          
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      
      - name: Install JS deps 📦
        run: npm ci

      - name: Check config
        run: |
          grep baseurl _config.yml
          grep url _config.yml

      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          
          BIB="$(bundle show al_folio_core)/_layouts/bib.liquid"
          
          python3 - "$BIB" <<'PY'
          from pathlib import Path
          import sys
          
          path = Path(sys.argv[1])
          text = path.read_text()
          
          old = '''{% capture periodical %}{{ entrytype }}{% if entrytype_text != "" and entryyear != "" %}, {% endif %}{{ entrymonth }}{{ entryyear }}{% endcapture %}'''
          new = '''{% capture periodical %}{{ entrytype }}{% if entry.volume %} {{ entry.volume }}{% if entry.pages %}, {{ entry.pages }}{% endif %}{% elsif entry.arxiv %} arXiv:{{ entry.arxiv }}{% elsif entry.eprint %} arXiv:{{ entry.eprint }}{% endif %}{% if entryyear != "" %} ({{ entryyear | strip }}){% endif %}{% endcapture %}'''
                    
          if old not in text:
            raise SystemExit("ERROR: target periodical block was not found in bib.liquid")
          
          text = text.replace(old, new, 1)
          
          old_website = '''{% if entry.website %}
            <a href="{{ entry.website }}" class="btn btn-sm z-depth-0" role="button">Website</a>
          {% endif %}'''
          
          new_website = '''{% if entry.url %}
            <a href="{{ entry.url }}" class="btn btn-sm z-depth-0" role="button">Full</a>
          {% endif %}
          {% if entry.website %}
            <a href="{{ entry.website }}" class="btn btn-sm z-depth-0" role="button">Website</a>
          {% endif %}'''
          
          if old_website not in text:
            raise SystemExit("ERROR: target website block was not found in bib.liquid")
          
          text = text.replace(old_website, new_website, 1)
          path.write_text(text)
          PY
          
          echo "===== BIB TEMPLATE AFTER PATCH ====="
          grep -n -A1 -B1 "capture periodical" "$BIB"
          
          echo "===== JEKYLL-SCHOLAR VERSION ====="
          bundle exec ruby -e 'puts Gem.loaded_specs["jekyll-scholar"]&.version || "jekyll-scholar not loaded"'
          echo "===== JEKYLL-SCHOLAR GEM ====="
          bundle info jekyll-scholar
          
          echo "===== BUILD ====="
          bundle exec jekyll build
          
      - name: Check build output
        run: |
          ls -la _site
          ls -la _site/assets
          ls -la _site/assets/css
      
      - name: Check generated html
        run: |
          find _site -name "*.html" | head -20
          grep -R "stylesheet" _site | head -20
          
      - name: Check about
        run: |
          find _site -iname "*about*"

      - name: Check generated link
        run: |
          find _site -name "*.html" | head -20
          grep -R "main.css" _site | head -20
          
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site


  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy 🚀
        uses: actions/deploy-pages@v4
# trigger rebuild
