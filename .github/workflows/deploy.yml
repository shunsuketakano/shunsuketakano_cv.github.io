name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!docs/CONTRIBUTING.md"
      - "!docs/CUSTOMIZE.md"
      - "!docs/FAQ.md"
      - "!docs/INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!docs/CONTRIBUTING.md"
      - "!docs/CUSTOMIZE.md"
      - "!docs/FAQ.md"
      - "!docs/INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check bibliography files
        run: |
          echo "===== BIBLIOGRAPHY ====="
          ls -la _bibliography/
          echo "===== MY PUBLICATION ====="
          test -f _bibliography/mypublication.bib && echo "FOUND" || echo "NOT FOUND"

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Check CSL styles
        run: |
          echo "csl-styles location:"
          bundle show csl-styles
          echo "Available APS/Nature styles:"
          find "$(bundle show csl-styles)" -type f \( -iname "*physics*.csl" -o -iname "*nature*.csl" -o -iname "*american*.csl" \) | sort

      - name: Locate page layout
        run: |
          CORE="$(bundle show al_folio_core)"
          echo "al_folio_core: $CORE"
          find "$CORE" -type f \( -name "page.liquid" -o -name "page.html" \) -print
      
      - name: Show al-folio head template
        run: |
          CORE="$(bundle show al_folio_core)"
          cat "$CORE/_includes/head.liquid"
          
      - name: Show default layout
        run: |
          CORE="$(bundle show al_folio_core)"
          cat "$CORE/_layouts/default.liquid"

      - name: Show metadata include
        run: |
          CORE="$(bundle show al_folio_core)"
          cat "$CORE/_includes/metadata.liquid"

      - name: Find date handling
        run: |
          CORE="$(bundle show al_folio_core)"
          grep -R -n -E "last_modified|modified_at|page.date|date.*page" "$CORE" \
            --include="*.liquid" \
            --include="*.rb" \
            | head -200

      - name: Show post layout
        run: |
          CORE="$(bundle show al_folio_core)"
          cat "$CORE/_layouts/post.liquid"

      - name: Show post date section
        run: |
          CORE="$(bundle show al_folio_core)"
          sed -n '15,35p' "$CORE/_layouts/post.liquid"

      - name: Check default includes
        run: |
          CORE="$(bundle show al_folio_core)"
          grep -n "include" "$CORE/_layouts/default.liquid"

      - name: Show header
        run: |
          CORE="$(bundle show al_folio_core)"
          cat "$CORE/_includes/header.liquid"
      
      - name: Locate bib template
        run: |
          echo "al_folio_core:"
          bundle show al_folio_core
          echo
          echo "bib.liquid:"
          find "$(bundle show al_folio_core)" -type f -name "bib.liquid" -print

      - name: Show bib template
        run: |
          cat "$(bundle show al_folio_core)/_layouts/bib.liquid"

      - name: Show bibliography layout
        run: |
          CORE="$(bundle show al_folio_core)"
          cat "$CORE/_layouts/bib.liquid"

      - name: Find related publications
        run: |
          grep -RIn "related_publications:" _learn _projects _pages _posts 2>/dev/null || true
          
      - name: Find learn layout
        run: |
          CORE="$(bundle show al_folio_core)"
          echo "=== project layouts ==="
          find _layouts -maxdepth 1 -type f -print
          echo "=== core layouts ==="
          find "$CORE/_layouts" -maxdepth 1 -type f -print
          echo "=== learn references ==="
          grep -RIn "layout.*learn\|related_publications\|bibliography.*cited" \
            _layouts "$CORE/_layouts" 2>/dev/null || true
      
      - name: Find bibliography rendering
        run: |
            CORE="$(bundle show al_folio_core)"
            echo "=== ALL bibliography rendering ==="
            grep -RIn "{% bibliography" _layouts "$CORE/_layouts" 2>/dev/null || true
            echo "=== ALL related_publications ==="
            grep -RIn "related_publications" _layouts "$CORE/_layouts" 2>/dev/null || true
      
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      
      - name: Install JS deps 📦
        run: npm ci

      - name: Check config
        run: |
          grep baseurl _config.yml
          grep url _config.yml

      - name: Check Scholar configuration
        run: |
          echo "===== SCHOLAR CONFIG ====="
          grep -n -A20 "^scholar:" _config.yml
          
          echo "===== BIBLIOGRAPHY FILES ====="
          find _bibliography -maxdepth 1 -type f -print
          
          echo "===== PROJECT FILE ====="
          cat _projects/1_project.md

      - name: Find citation tags
        run: |
          grep -RIn "{% cite" \
            --exclude-dir=.git \
            --exclude-dir=vendor \
            .

      - name: Show page layout
        run: |
          CORE="$(bundle show al_folio_core)"
          cat "$CORE/_layouts/page.liquid"

      - name: Show core page layout
        run: |
          CORE="$(bundle show al_folio_core)"
          cat "$CORE/_layouts/page.liquid"
    
      - name: Show jekyll-scholar version
        run: |
          bundle exec jekyll-scholar --version || bundle exec jekyll -v
    
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          
          BIB="$(bundle show al_folio_core)/_layouts/bib.liquid"
          
          python3 - "$BIB" <<'PY'
          from pathlib import Path
          import sys
          
          path = Path(sys.argv[1])
          text = path.read_text()
          
          old = '''{% capture periodical %}{{ entrytype }}{% if entrytype_text != "" and entryyear != "" %}, {% endif %}{{ entrymonth }}{{ entryyear }}{% endcapture %}'''
          new = '''{% capture periodical %}
          {% if entry.type == "award" %}
            {% if entry.booktitle %}{{ entry.booktitle }}{% endif %}
            {% if entry.volume %} {{ entry.volume }}{% endif %}
            {% if entryyear != "" %}
              ({{ entryyear | strip }}/{% assign month_name = entry.month | downcase %}
              {% case month_name %}
                {% when "january" %}01
                {% when "february" %}02
                {% when "march" %}03
                {% when "april" %}04
                {% when "may" %}05
                {% when "june" %}06
                {% when "july" %}07
                {% when "august" %}08
                {% when "september" %}09
                {% when "october" %}10
                {% when "november" %}11
                {% when "december" %}12
                {% else %}{{ entry.month }}{% endcase %}/{% if entry.day %}{{ entry.day | prepend: "0" | slice: -2, 2 }}{% endif %})
            {% endif %}
          {% elsif entry.type == "book" %}
            {% if entry.series %}{{ entry.series }}{% endif %}
            {% if entry.number %} {{ entry.number }}{% endif %}
            {% if entry.edition %}, {{ entry.edition }}版{% endif %}
            {% if entry.transauthor %}, {{ entry.transauthor }}訳{% endif %}
            {% if entry.publisher %}, {{ entry.publisher }}{% endif %}
            {% if entry.address %}, {{ entry.address }}{% endif %}
            {% if entryyear != "" %} ({{ entryyear | strip }}){% endif %}

          {% elsif entry.type == "conference" %}
            {{ entry.booktitle }}
            {% if entry.volume %} {{ entry.volume }}{% endif %}
            {% if entryyear != "" %}
              ({{ entryyear | strip }}/{% assign month_name = entry.month | downcase %}
              {% case month_name %}
                {% when "January" %}01
                {% when "February" %}02
                {% when "March" %}03
                {% when "April" %}04
                {% when "May" %}05
                {% when "June" %}06
                {% when "July" %}07
                {% when "August" %}08
                {% when "September" %}09
                {% when "October" %}10
                {% when "November" %}11
                {% when "December" %}12
                {% else %}{{ entry.month }}{% endcase %}/
              {% if entry.day %}{{ entry.day | prepend: "0" | slice: -2, 2 }}{% endif %})
            {% endif %}
            {% if entry.address %}, {{ entry.address }}{% endif %}
          {% else %}
            {{ entrytype }}
            {% if entry.volume %}
              {{ entry.volume }}
              {% if entry.pages %}, {{ entry.pages }}{% endif %}
            {% elsif entry.arxiv %}
              arXiv:{{ entry.arxiv }}
            {% elsif entry.eprint %}
              arXiv:{{ entry.eprint }}
            {% endif %}
            {% if entryyear != "" %} ({{ entryyear | strip }}){% endif %}
          {% endif %}
          {% endcapture %}'''
          
          if old not in text:
            raise SystemExit("ERROR: target periodical block was not found in bib.liquid")
          
          path.write_text(text.replace(old, new, 1))
          print(f"Patched: {path}")
          PY
          
          HEAD="$(bundle show al_folio_core)/_includes/head.liquid"
          
          python3 - "$HEAD" <<'PY'
          from pathlib import Path
          import sys
          
          path = Path(sys.argv[1])
          text = path.read_text()
          
          marker = '{% elsif site.icon and site.icon != \'\' %}'
          start = text.find(marker)
          
          if start == -1:
            raise SystemExit("ERROR: favicon elsif block was not found")
          
          end_marker = '{% endif %}'
          end = text.find(end_marker, start)
          
          if end == -1:
            raise SystemExit("ERROR: favicon endif was not found")
          
          end += len(end_marker)
          
          new = '''{% elsif site.icon and site.icon != '' %}
            {% assign icon_extension = site.icon | split: '.' | last | split: '?' | first | downcase %}
            {% if icon_extension == 'png' %}
              <link
                rel="icon"
                type="image/png"
                href="{{ '/assets/img/' | append: site.icon | relative_url }}"
              >
            {% elsif icon_extension == 'jpg' or icon_extension == 'jpeg' %}
              <link
                rel="icon"
                type="image/jpeg"
                href="{{ '/assets/img/' | append: site.icon | relative_url }}"
              >
            {% endif %}
          {% endif %}'''
          
          text = text[:start] + new + text[end:]
          path.write_text(text)
          
          print(f"Patched favicon: {path}")
          PY

          echo "=== site.icon ==="
          grep -nE '^[[:space:]]*icon:' _config.yml
          
          echo "=== patched favicon logic ==="
          nl -ba "$HEAD" | sed -n '87,115p'

          echo "=== patched favicon block ==="
          nl -ba "$HEAD" | sed -n '87,115p'
          
          echo "===== BIBLIOGRAPHY FILES ====="
          find _bibliography -maxdepth 1 -type f -print
          
          echo "===== MYPUBLICATION ====="
          test -f _bibliography/mypublication.bib && echo "MYPUBLICATION: FOUND" || echo "MYPUBLICATION: NOT FOUND"
          
          echo "===== JOURNAL KEYWORDS IN BIB ====="
          grep -in "keywords.*journal" _bibliography/mypublication.bib || true
          
          echo "===== SCHOLAR CONFIG ====="
          grep -n -A20 "^scholar:" _config.yml

          echo "===== PUBLICATIONS PAGE ====="
          cat _pages/publications.md

          echo "===== JEKYLL-SCHOLAR VERSION ====="
          bundle exec ruby -e 'require "jekyll/scholar"; puts Jekyll::Scholar::VERSION rescue puts "VERSION UNKNOWN"'
          
          echo "===== JEKYLL-SCHOLAR GEM PATH ====="
          bundle info jekyll-scholar

          echo "===== SCHOLAR UTILITIES ====="
          SCHOLAR="$(bundle info jekyll-scholar --path)"
          echo "$SCHOLAR"
          sed -n '190,245p' "$SCHOLAR/lib/jekyll/scholar/utilities.rb"

          echo "===== BIBLIOGRAPHY TAG ====="
          SCHOLAR="$(bundle info jekyll-scholar --path)"
          grep -R -n -A30 -B10 "class.*Bibliography\|def render" "$SCHOLAR/lib/jekyll/scholar" | head -200
          
          echo "===== CONFERENCE ENTRYTYPE DEBUG ====="
          grep -R -n -A20 -B10 "entrytype" "$BIB" | head -100
          
          echo "===== BIB TEMPLATE AFTER PATCH ====="
          grep -n -A20 -B5 "capture periodical" "$BIB"
          
          echo "===== DIMENSIONS IN BIB TEMPLATE ====="
          grep -n -i -A5 -B5 "dimensions" "$BIB" || true

          echo "===== DIMENSIONS BADGE LOGIC ====="
          grep -R -n -A10 -B10 "entry_has_dimensions_badge" "$BIB" "$(bundle info al_folio_core --path)" 2>/dev/null | head -100

          echo "===== PUBLICATION BADGES CONFIG ====="
          grep -n -A10 -B2 "enable_publication_badges" _config.yml || true
          
          echo "===== ACHIEVEMENTS FILE ====="
          cat _pages/achievements.md
          
          echo "===== PRESENTATIONS FILE ====="
          cat _pages/presentations.md
          
          echo "===== ALL PAGE FRONT MATTER ====="
          find _pages -maxdepth 1 -type f -name "*.md" -print | sort
          
          echo "===== NAV / CHILDREN ====="
          grep -R -n -A20 -B2 "children:" _pages _data 2>/dev/null || true

          echo "===== NAVIGATION IMPLEMENTATION ====="
          CORE="$(bundle show al_folio_core)"
          
          echo "$CORE"
          grep -R -n -E "children|dropdown" "$CORE" \
          --include="*.liquid" \
          --include="*.rb" \
          | head -200
          
          echo "===== PRESENTATION HTML STRUCTURE ====="
          grep -R -n -A5 -B5 "Symposium on Molecular Chirality" _site/presentations/index.html | head -100
          
          echo "===== BUILD ====="
          bundle exec jekyll build

          echo "=== generated favicon tags ==="
          grep -RIn 'rel="icon"\|rel="shortcut icon"' _site --include='*.html' | head -30
          
          echo "=== generated favicon hrefs ==="
          grep -RIn 'Malerei2\|rel="icon"\|shortcut icon' _site --include='*.html' | head -30
          
      - name: Check build output
        run: |
          ls -la _site
          ls -la _site/assets
          ls -la _site/assets/css

      - name: Check generated favicon HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          for name in [
            "_site/index.html",
            "_site/learn/index.html",
            "_site/learn/electromagnetism_01_MaxwellEqVac/index.html",
          ]:
            path = Path(name)
            
            print()
            print("=" * 80)
            print(name)
            print("=" * 80)
            
            if not path.exists():
              print("FILE NOT FOUND")
              continue
            
            lines = path.read_text(errors="replace").splitlines()
            
            print("--- first 15 lines ---")
            for i, line in enumerate(lines[:15], 1):
              print(f"{i}: {line}")
            
            print("--- favicon/icon lines ---")
            for i, line in enumerate(lines, 1):
              lower = line.lower()
              if (
                "favicon" in lower
                or "rel=\"icon\"" in lower
                or "rel='icon'" in lower
                or "apple-touch-icon" in lower
                or "malerei" in lower
                or "⚛" in line
              ):
                print(f"{i}: {line}")
          PY

      - name: Show favicon logic
        run: |
          CORE="$(bundle show al_folio_core)"
          echo "=== favicon logic ==="
          sed -n '80,115p' "$CORE/_includes/head.liquid"

      - name: Inspect favicon lines exactly
        run: |
          CORE="$(bundle show al_folio_core)"
          FILE="$CORE/_includes/head.liquid"
          
          echo "=== lines 87-112 with line numbers ==="
          nl -ba "$FILE" | sed -n '87,112p'
          
          echo "=== raw bytes around favicon logic ==="
          sed -n '87,112p' "$FILE" | cat -A
      
      - name: Locate icon logic
        run: |
          CORE="$(bundle show al_folio_core)"
          
          echo "=== site.icon in core ==="
          grep -RIn "site.icon" "$CORE" --include="*.liquid" 2>/dev/null || true
          
          echo "=== rel=icon in core ==="
          grep -RIn 'rel="icon"\|rel='\''icon'\''' "$CORE" --include="*.liquid" 2>/dev/null || true
          
          echo "=== favicon in core ==="
          grep -RIn "favicon" "$CORE" --include="*.liquid" 2>/dev/null || true

      - name: Verify favicon
        run: |
          CORE="$(bundle show al_folio_core)"
          echo "=== patched favicon logic ==="
          nl -ba "$CORE/_includes/head.liquid" | sed -n '87,115p'

          echo "=== generated favicon links ==="
          grep -RIn '<link[^>]*rel="icon"' _site --include='*.html' | head -20
          
      - name: Check generated html
        run: |
          find _site -name "*.html" | head -20
          grep -R "stylesheet" _site | head -20
          
      - name: Check about
        run: |
          find _site -iname "*about*"

      - name: Check generated link
        run: |
          find _site -name "*.html" | head -20
          grep -R "main.css" _site | head -20
          
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site


  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy 🚀
        uses: actions/deploy-pages@v4
# trigger rebuild
