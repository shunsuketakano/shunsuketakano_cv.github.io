name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

jobs:
  check-links-on-site:
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-a-workflow-based-on-the-conclusion-of-another-workflow
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          
          BIB="$(bundle show al_folio_core)/_layouts/bib.liquid"
          
          python3 - "$BIB" <<'PY'
          from pathlib import Path
          import sys
          
          path = Path(sys.argv[1])
          text = path.read_text()
          
          old = '{% capture periodical %}{{ entrytype }}{% if entrytype_text != "" and entryyear != "" %}, {% endif %}{{ entrymonth }}{{ entryyear }}{% endcapture %}'
          new = '{% capture periodical %}{{ entrytype }}{% if entry.volume %} {{ entry.volume }}{% endif %}{% if entry.pages %}, {{ entry.pages }}{% endif %}{% if entryyear != "" %} ({{ entryyear | strip }}){% endif %}{% endcapture %}'
          
          if old not in text:
            raise SystemExit("ERROR: target periodical line was not found")
          
          path.write_text(text.replace(old, new, 1))
          print(f"Patched: {path}")
          PY

          echo "===== CHECK BIB FILE ====="
          grep -A15 -B2 "Takano2025PhysRevE" _bibliography/*.bib || true
          echo "===== CHECK AL_FOLIO BIB TEMPLATE ====="
          BIB="$(bundle show al_folio_core)/_layouts/bib.liquid"
          grep -n "capture periodical" "$BIB"
          
          echo "===== CHECK BIB ENTRY FIELDS ====="
          ruby -e '
            require "bibtex"
            f = Dir["_bibliography/*.bib"].first
            b = BibTeX.open(f)
            e = b["Takano2025PhysRevE"]
            puts "TYPE   = #{e.type.inspect}"
            puts "VOLUME = #{e["volume"].inspect}"
            puts "NUMBER = #{e["number"].inspect}"
            puts "PAGES  = #{e["pages"].inspect}"
            puts "YEAR   = #{e["year"].inspect}"
            puts "DOI    = #{e["doi"].inspect}"
            puts "ARXIV  = #{e["arxiv"].inspect}"
          '
          
          from pathlib import Path
          import re
          
          src = Path("_bibliography/mypublication.bib")
          text = src.read_text()
          
          entries = re.split(r'(?=^@)', text, flags=re.MULTILINE)
          
          journal = []
          book = []
          other = []
          
          for entry in entries:
            if not entry.strip():
              continue
            
            m = re.search(r'keywords\s*=\s*\{([^}]*)\}', entry, re.IGNORECASE)
            keywords = m.group(1).lower().split(",") if m else []
            keywords = [k.strip() for k in keywords]
            
            if "journal" in keywords:
              journal.append(entry)
            elif "preprint" in keywords:
              preprint.append(entry)
            elif "proceedings" in keywords:
              proceedings.append(entry)
          
          out = Path("_bibliography")
          
          (out / "journal.bib").write_text("\n".join(journal))
          (out / "preprint.bib").write_text("\n".join(preprint))
          (out / "proceedings.bib").write_text("\n".join(proceedings))
          
          print(f"journal: {len(journal)}")
          print(f"preprint: {len(preprint)}")
          print(f"proceedings: {len(proceedings)}")
          PY
          
          bundle exec jekyll build
                    
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          fail: true
          # only check local links
          args: --offline --remap '_site(/?.*)/assets/(.*) _site/assets/$2' --verbose --no-progress '_site/**/*.html'
