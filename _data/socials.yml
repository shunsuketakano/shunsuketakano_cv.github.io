<!-- 人間には見えてコピペもできるボット除けメールリンク -->
<p>Contact: <span id="email-link"></span></p>

<script>
  (function() {
    // メールアドレスを分解してボットの検索を攪乱します
    var user = "shunsuke.t-8395"; // @より前の部分
    var domain = "akane.waseda.jp";  // @より後ろの部分
    
    var element = document.getElementById("email-link");
    var email = user + "@" + domain;
    
    // 画面にリンクを生成（人間には普通のアドレスに見え、コピペも可能）
    element.innerHTML = '<a href="mailto:' + email + '">' + email + '</a>';
  })();
</script>
